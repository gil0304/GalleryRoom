<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Exhibition Demo — GalleryRoom.js</title>
  <link rel="stylesheet" href="../dist/gallery-room.css">
  <style>body { margin: 0; }</style>
</head>
<body>
  <div id="gallery"></div>

  <script src="../dist/gallery-room.js"></script>
  <script>
    GalleryRoom.create("#gallery", {
      title: "Light and Shadow",
      subtitle: "Photo Exhibition by Ryogo",
      theme: "museum",
      layout: "horizontal",
      enableMap: true,
      enableFilter: true,
      enableDepth: true,
      works: [
        {
          id: "photo-01",
          title: "Blue Hour",
          type: "image",
          src: "../assets/sample-01.png",
          year: "2026",
          category: "City",
          caption: "夕暮れの街を撮影した一枚。",
          author: "Ryogo",
          size: "800 × 600"
        },
        {
          id: "photo-02",
          title: "Red Wall",
          type: "image",
          src: "../assets/sample-02.png",
          year: "2025",
          category: "City",
          caption: "路地の赤い壁。",
          author: "Ryogo",
          size: "800 × 600"
        },
        {
          id: "photo-03",
          title: "Forest Path",
          type: "image",
          src: "../assets/sample-04.png",
          year: "2025",
          category: "Nature",
          caption: "朝の森を歩く。",
          author: "Ryogo",
          size: "600 × 800"
        },
        {
          id: "photo-04",
          title: "Golden Field",
          type: "image",
          src: "../assets/sample-05.png",
          year: "2024",
          category: "Nature",
          caption: "収穫前の畑。",
          author: "Ryogo",
          size: "800 × 600"
        },
        {
          id: "photo-05",
          title: "Portrait in Violet",
          type: "image",
          src: "../assets/sample-06.png",
          year: "2026",
          category: "People",
          caption: "紫の光の中のポートレート。",
          author: "Ryogo",
          size: "800 × 800"
        },
        {
          id: "photo-06",
          title: "Night Pool",
          type: "image",
          src: "../assets/sample-07.png",
          year: "2024",
          category: "Night",
          caption: "夜のプールサイド。",
          author: "Ryogo",
          size: "800 × 500"
        }
      ]
    });
  </script>
</body>
</html>
